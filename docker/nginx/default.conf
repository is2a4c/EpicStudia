server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Загрузка видео может быть крупной.
    client_max_body_size 2048M;

    # Liveness API через прокси (curl http://localhost/health).
    location = /health {
        proxy_pass http://api:5000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Весь backend (включая стриминг видео и live) ходит через /api/v1.
    location /api/ {
        proxy_pass http://api:5000/api/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Стриминг видео и крупные загрузки: без буферизации, длинные таймауты.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Раздача загруженных медиа, если backend начнёт отдавать их по /uploads/.
    location /uploads/ {
        proxy_pass http://api:5000/uploads/;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # SPA-роутинг: всё остальное отдаём index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
