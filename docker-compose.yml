services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-epicstudia}
      MARIADB_USER: ${DB_USER:-epicstudia}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      # Внутри сети контейнеров БД доступна по имени сервиса.
      DB_URL: db
    expose:
      - "5000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - api_uploads:/app/uploads
    restart: unless-stopped
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    user: "10001:10001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  mediamtx:
    image: bluenviron/mediamtx:latest
    restart: unless-stopped
    environment:
      MTX_RTSP: "no"
      MTX_WEBRTC: "no"
      MTX_SRT: "no"
      MTX_API: "no"
      MTX_RTMP: "yes"
      MTX_HLS: "yes"
      MTX_HLSADDRESS: ":8888"
      MTX_HLSALWAYSREMUX: "yes"
      MTX_HLSVARIANT: mpegts
    ports:
      # RTMP-приём от OBS (наружу через Zoraxy stream :1935). HLS (8888) — только внутри.
      - "${RTMP_PORT:-1935}:1935"
    networks:
      - internal
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: .
      dockerfile: ./docker/web.Dockerfile
    ports:
      - "${WEB_PORT:-80}:8080"
    depends_on:
      api:
        condition: service_healthy
      mediamtx:
        condition: service_started
    restart: unless-stopped
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run

volumes:
  api_uploads:
  db_data:

networks:
  internal:
    driver: bridge
